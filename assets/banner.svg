<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Arpit Singh - Security researcher and local-first AI builder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08080f"/>
      <stop offset="0.55" stop-color="#10101d"/>
      <stop offset="1" stop-color="#171126"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b7bff"/>
      <stop offset="0.55" stop-color="#6c4ef6"/>
      <stop offset="1" stop-color="#ff2d87"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d87"/>
      <stop offset="1" stop-color="#ff8ab7"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <circle cx="1010" cy="30" r="230" fill="url(#glow)"/>
  <circle cx="80" cy="290" r="180" fill="url(#glow)" opacity="0.45"/>
  <path d="M0 268C210 210 390 310 610 258s360-52 590 4" fill="none" stroke="url(#violet)" stroke-opacity="0.35" stroke-width="2"/>

  <rect x="46" y="42" width="212" height="29" rx="14.5" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="64" cy="56.5" r="4" fill="#4ade80"/>
  <text x="78" y="61" fill="#d8d2e7" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.8">AVAILABLE FOR BUILDING</text>

  <text x="46" y="145" fill="#ffffff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-2">ARPIT</text>
  <text x="46" y="211" fill="url(#pink)" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-2">SINGH</text>
  <text x="49" y="248" fill="#a9a1bd" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="500">Security research  /  local-first AI  /  Android + Windows tools</text>

  <rect x="46" y="276" width="142" height="26" rx="8" fill="#6c4ef6" fill-opacity="0.18" stroke="#9b7bff" stroke-opacity="0.45"/>
  <text x="60" y="293" fill="#c9b8ff" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">SECURITY FIRST</text>
  <rect x="198" y="276" width="142" height="26" rx="8" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="212" y="293" fill="#cfc6e2" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">LOCAL-FIRST AI</text>

  <g transform="translate(700 48)">
    <rect width="452" height="226" rx="18" fill="#0f0d18" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect width="452" height="38" rx="18" fill="#ffffff" fill-opacity="0.04"/>
    <rect y="20" width="452" height="18" fill="#ffffff" fill-opacity="0.04"/>
    <circle cx="22" cy="19" r="4.5" fill="#ff5f57"/>
    <circle cx="38" cy="19" r="4.5" fill="#febc2e"/>
    <circle cx="54" cy="19" r="4.5" fill="#28c840"/>
    <text x="76" y="23" fill="#7d7594" font-family="Consolas, monospace" font-size="10">arpit@insafelabs: ~</text>
    <text x="22" y="72" fill="#7d7594" font-family="Consolas, monospace" font-size="12">$ whoami</text>
    <text x="22" y="94" fill="#f4f0fb" font-family="Consolas, monospace" font-size="13">security researcher &amp; builder</text>
    <text x="22" y="126" fill="#7d7594" font-family="Consolas, monospace" font-size="12">$ focus</text>
    <text x="22" y="148" fill="#c9b8ff" font-family="Consolas, monospace" font-size="13">local-first AI  ·  offensive security</text>
    <text x="22" y="180" fill="#7d7594" font-family="Consolas, monospace" font-size="12">$ status</text>
    <circle cx="26" cy="200" r="4" fill="#4ade80"/>
    <text x="38" y="204" fill="#4ade80" font-family="Consolas, monospace" font-size="12">building in public</text>
    <rect x="286" y="184" width="144" height="28" rx="8" fill="url(#violet)" fill-opacity="0.9"/>
    <text x="302" y="202" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">OPEN SOURCE</text>
  </g>

  <text x="46" y="307" fill="#6f6785" font-family="Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="1.2">github.com/arpitsingh404</text>
